<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เลือกสาขาที่ใช่ | วอศ.สุพรรณบุรี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kanit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#FFF7D6; --fg:#0F172A; --muted:#475569; --card:#FFFFFF;
  --primary:#EC4899; --on-primary:#0F172A; --accent:#2563EB; --on-accent:#FFFFFF;
  --ok:#16A34A; --bad:#DC2626; --term:#0B1220; --term-fg:#4ADE80;
  --border:3px solid var(--fg); --shadow:6px 6px 0 var(--fg); --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Kanit",system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;
  background-image:radial-gradient(rgba(15,23,42,.08) 1.5px,transparent 1.5px);background-size:22px 22px;line-height:1.55}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:#fff;padding:8px;z-index:99}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:var(--border);background:var(--card);position:sticky;top:0;z-index:10}
.brand{font-weight:900;font-size:1.05rem}.brand span{color:var(--primary)}
.step{font-weight:600;font-size:.95rem;background:var(--fg);color:#fff;padding:4px 12px;border-radius:999px}
main{max-width:860px;margin:0 auto;padding:28px 18px 80px}
h1{font-weight:900;font-size:clamp(1.8rem,5vw,3rem);line-height:1.15;margin:.2em 0}
h2{font-weight:800;font-size:clamp(1.4rem,4vw,2.2rem);line-height:1.2;margin:.2em 0 .4em}
p.lead{font-size:1.1rem;color:var(--muted);margin:0 0 20px}
.hl{background:var(--primary);padding:0 .25em;border:2px solid var(--fg);border-radius:8px;display:inline-block;transform:rotate(-1.5deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.major{all:unset;cursor:pointer;background:var(--card);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:6px;min-height:110px;transition:transform .15s,box-shadow .15s}
.major:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--fg)}
.major:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--fg)}
.major:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.major .ico{font-size:2rem;line-height:1}.major b{font-size:1.1rem}.major small{color:var(--muted)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;font-weight:800;font-size:1.1rem;border:var(--border);border-radius:12px;box-shadow:4px 4px 0 var(--fg);background:var(--primary);color:var(--on-primary);transition:transform .15s,box-shadow .15s,background .2s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--fg)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--fg)}
.btn.alt{background:var(--card)}.btn.blue{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed;font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;align-items:center}
.card{background:var(--card);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.meme{position:relative;border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;background:#111;max-width:560px;margin:0 auto;aspect-ratio:1/1}
.meme img{width:100%;height:100%;object-fit:cover;display:block}
.meme .bigemoji{width:100%;height:100%;display:grid;place-items:center;font-size:clamp(7rem,30vw,13rem);background:linear-gradient(135deg,#fde68a,#f9a8d4 60%,#93c5fd)}
.cap{position:absolute;left:0;right:0;text-align:center;padding:10px 14px;font-family:"Anton","Kanit",Impact,sans-serif;font-weight:900;color:#fff;text-transform:uppercase;font-size:clamp(1.4rem,5.4vw,2.6rem);line-height:1.1;
  text-shadow:3px 3px 0 #000,-3px 3px 0 #000,3px -3px 0 #000,-3px -3px 0 #000,0 3px 0 #000,3px 0 0 #000,0 -3px 0 #000,-3px 0 0 #000}
.cap.top{top:0}.cap.bot{bottom:0}
.center{text-align:center}
.bar{height:34px;border:var(--border);border-radius:999px;background:#fff;overflow:hidden;margin:18px 0}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--primary) 0 14px,#f472b6 14px 28px);transition:width .2s}
.err{font-family:ui-monospace,Consolas,monospace;background:var(--term);color:#f87171;padding:14px;border-radius:12px;border:var(--border);white-space:pre-wrap}
.video{position:relative;aspect-ratio:16/9;border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{all:unset;cursor:pointer;border:var(--border);border-radius:12px;padding:12px 16px;background:#fff;font-weight:600;min-height:44px;box-shadow:3px 3px 0 var(--fg);transition:transform .15s,background .2s}
.opt:hover{background:#fdf2f8}
.opt.right{background:#bbf7d0}.opt.wrong{background:#fecaca}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.drake{display:grid;grid-template-columns:1fr 1.4fr;border:var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:#fff;max-width:620px;margin:0 auto}
.drake>div{padding:18px;display:flex;align-items:center;min-height:150px;border-bottom:var(--border);font-weight:800;font-size:clamp(1rem,3.4vw,1.4rem)}
.drake .face{justify-content:center;font-size:clamp(3.5rem,12vw,6rem);background:#fde68a;border-right:var(--border)}
.drake>div:nth-last-child(-n+2){border-bottom:0}
.drake .yes{background:#dcfce7}.drake .no{background:#fee2e2;text-decoration:line-through;text-decoration-thickness:3px}
.arena{position:relative;min-height:220px}
#runaway{position:relative;transition:left .18s ease,top .18s ease}
.term{background:var(--term);color:var(--term-fg);font-family:ui-monospace,Consolas,monospace;border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-height:170px;white-space:pre-wrap;font-size:1rem}
.cursor{display:inline-block;width:.6em;background:var(--term-fg);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.learn{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.learn div{border:var(--border);border-radius:12px;padding:12px;background:#fff;font-weight:600}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(300%);visibility:hidden;background:var(--fg);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;max-width:92vw;transition:transform .25s;z-index:50}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.scene{animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) rotate(-1deg)}to{opacity:1;transform:none}}
.offline{background:#fff;border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.offline canvas{display:block;width:100%;height:auto;margin-top:14px;border:2px dashed #CBD5E1;border-radius:10px;cursor:pointer;touch-action:manipulation;background:#F8FAFC}
kbd{border:2px solid var(--fg);border-radius:6px;padding:0 6px;background:#f1f5f9;font-family:inherit}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
footer{text-align:center;color:var(--muted);font-size:.9rem;padding:20px}
@media (max-width:520px){.drake{grid-template-columns:1fr 1.6fr}header{padding:10px 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- v2 extras ---------- */
.gif{display:block;width:100%;height:100%;object-fit:cover}
.gifbox{border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;background:#fde68a;aspect-ratio:1/1;max-width:340px;margin:0 auto}
.fallback{width:100%;height:100%;display:grid;place-items:center;font-size:clamp(4rem,18vw,8rem);background:linear-gradient(135deg,#fde68a,#f9a8d4 60%,#93c5fd)}
.reaction{float:right;width:120px;margin:0 0 10px 12px;aspect-ratio:1/1}
#clipcat{position:fixed;width:110px;height:110px;z-index:30;cursor:pointer;border:0;padding:0;background:none;display:none;filter:drop-shadow(3px 3px 0 #0F172A)}
#clipcat img,#clipcat .fallback{border-radius:14px;border:3px solid #0F172A}
#clipcat.on{display:block;animation:clip .9s steps(2) infinite}
@keyframes clip{0%{transform:translate(0,0) rotate(0) skewX(0);clip-path:inset(0 0 0 0)}25%{transform:translate(-6px,3px) rotate(-8deg) skewX(10deg);clip-path:inset(10% 0 30% 0)}50%{transform:translate(5px,-4px) rotate(6deg);clip-path:inset(0 20% 0 0)}75%{transform:translate(-3px,-2px) rotate(-3deg) skewX(-12deg);clip-path:inset(40% 0 0 10%)}}
.captcha{max-width:420px;margin:0 auto;border:var(--border);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.captcha .head{background:#4A90E2;color:#fff;padding:16px}
.captcha .head b{font-size:1.4rem;display:block}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:#fff}
.cgrid button{all:unset;cursor:pointer;aspect-ratio:1/1;position:relative;overflow:hidden;background:#eee}
.cgrid button.sel{outline:4px solid #4A90E2;outline-offset:-4px}
.cgrid button.sel::after{content:"✓";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#4A90E2;color:#fff;display:grid;place-items:center;font-weight:900}
.cgrid button:focus-visible{outline:4px solid var(--primary);outline-offset:-4px}
.wheelwrap{position:relative;width:min(340px,86vw);aspect-ratio:1/1;margin:10px auto}
.wheel{width:100%;height:100%;border-radius:50%;border:var(--border);box-shadow:var(--shadow);transition:transform 4.5s cubic-bezier(.12,.8,.12,1);position:relative;overflow:hidden}
.wheel span{position:absolute;left:50%;top:50%;transform-origin:0 0;font-weight:800;font-size:.72rem;white-space:nowrap;overflow:hidden;width:46%;text-align:right;padding-right:10px;line-height:1}
.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:2.4rem;z-index:2;filter:drop-shadow(2px 2px 0 #0F172A)}
.slot{display:flex;gap:10px;justify-content:center;margin:16px 0}
.reel{width:min(100px,26vw);aspect-ratio:3/4;border:var(--border);border-radius:14px;background:#fff;display:grid;place-items:center;font-size:clamp(2.6rem,10vw,4rem);box-shadow:4px 4px 0 var(--fg)}
.reel.spin{animation:reel .12s linear infinite}
@keyframes reel{50%{transform:translateY(-6px)}}
.machine{background:linear-gradient(#f43f5e,#be123c);border:var(--border);border-radius:24px;padding:18px;box-shadow:var(--shadow);color:#fff;text-align:center;max-width:460px;margin:0 auto}
.phone{max-width:340px;margin:0 auto;background:#0B1220;color:#fff;border:var(--border);border-radius:36px;box-shadow:var(--shadow);padding:30px 22px;text-align:center;min-height:460px;display:flex;flex-direction:column}
.phone .avatar{width:96px;height:96px;border-radius:50%;margin:10px auto;display:grid;place-items:center;font-size:3rem;background:#1e293b;border:3px solid #fff;animation:ring 1s infinite}
@keyframes ring{50%{box-shadow:0 0 0 14px rgba(74,222,128,.25)}}
.callbtns{margin-top:auto;display:flex;justify-content:space-around}
.callbtns button{all:unset;cursor:pointer;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;border:3px solid #fff}
.callbtns .acc{background:#16A34A}.callbtns .dec{background:#DC2626}
.callbtns button:focus-visible{outline:4px solid #93c5fd;outline-offset:3px}
.chat{display:flex;flex-direction:column;gap:8px;text-align:left;margin-top:8px}
.bub{background:#fff;color:#0F172A;padding:8px 12px;border-radius:16px 16px 16px 4px;max-width:85%;font-size:.98rem;animation:pop .25s}
.bub.me{align-self:flex-end;background:#4ADE80;border-radius:16px 16px 4px 16px}
.typing{color:#94a3b8;font-size:.9rem}
.bsod{background:#0078D7;color:#fff;border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(20px,6vw,48px);min-height:380px;font-family:"Segoe UI","Kanit",sans-serif}
.bsod .sad{font-size:clamp(4rem,14vw,7rem);line-height:1;margin-bottom:16px}
.hack{background:#000;color:#22c55e;font-family:ui-monospace,Consolas,monospace;border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;height:260px;overflow:hidden;white-space:pre-wrap;font-size:.92rem;cursor:text}
.granted{font-size:clamp(1.6rem,6vw,2.6rem);font-weight:900;color:#22c55e;text-align:center;text-shadow:0 0 10px #22c55e;animation:blink 0.6s steps(1) 4}
.drake2{display:grid;grid-template-columns:1fr 1.3fr;border:var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:#fff;max-width:620px;margin:0 auto}
.drake2>div{display:flex;align-items:center;padding:14px;font-weight:800;font-size:clamp(1rem,3.4vw,1.35rem);border-bottom:var(--border);min-height:150px}
.drake2>.pic{padding:0;border-right:var(--border)}
.drake2>div:nth-last-child(-n+2){border-bottom:0}
.drake2 .no{background:#fee2e2}.drake2 .yes{background:#dcfce7}
.duo{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:520px;margin:16px auto 0}
.iconbtn{all:unset;cursor:pointer;min-width:40px;min-height:40px;display:grid;place-items:center;border:2px solid var(--fg);border-radius:10px;font-size:1.1rem;background:#fff}
.iconbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rain{position:fixed;top:-60px;font-size:2.4rem;z-index:45;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.trail{position:fixed;pointer-events:none;z-index:44;font-size:1rem;animation:fade .7s forwards}
@keyframes fade{to{opacity:0;transform:translateY(-16px) scale(.6)}}
</style>
</head>
<body>
<a class="skip" href="#stage">ข้ามไปเนื้อหา</a>
<header>
  <div class="brand">วอศ.<span>สุพรรณบุรี</span> × แนะแนว</div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="iconbtn" id="sndBtn" aria-label="เปิด/ปิดเสียง">🔊</button>
    <button class="btn ghost" id="backBtn" style="min-height:40px;padding:6px 12px">← ย้อนกลับ</button>
    <span class="step" id="step" aria-live="polite">หน้าแรก</span>
  </div>
</header>
<main id="stage" tabindex="-1"></main>
<footer>ทำด้วยความรัก (และบั๊กนิดหน่อย) โดยแผนกคอมพิวเตอร์โปรแกรมเมอร์ · พิมพ์ <kbd>meow</kbd> ดูสิ 🐾</footer>
<button id="clipcat" aria-label="แมวทะลุกำแพง กดเพื่อจับ"></button>
<div class="toast" id="toast" role="status"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d+.02)}catch(e){} }
function meow(){ if(muted)return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type="sawtooth";
  o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(1100,t+.12);o.frequency.exponentialRampToValueAtTime(500,t+.45);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.5);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.55)}catch(e){} }
const tada=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.15,"triangle",.07),i*110));
const fail=()=>[300,220].forEach((f,i)=>setTimeout(()=>beep(f,.2,"sawtooth",.05),i*150));

document.getElementById("sndBtn").onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?"🔇":"🔊"};

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600)}
function render(html){clearAll();stage.innerHTML=`<section class="scene">${html}</section>`;stage.focus({preventScroll:true});window.scrollTo({top:0,behavior:"smooth"})}

function confetti(){ if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#EC4899","#2563EB","#FACC15","#16A34A","#F97316"];
  const ps=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,r:4+Math.random()*6,vy:2+Math.random()*4,vx:-2+Math.random()*4,a:Math.random()*6,c:cols[Math.floor(Math.random()*5)]}));
  let f=0;(function draw(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});
    if(++f<260)requestAnimationFrame(draw);else x.clearRect(0,0,c.width,c.height)})()}
